name: Docker image

# Mỗi lần push lên main: kiểm thử rồi đóng gói image và đẩy lên GitHub Container Registry
# Chạy trên VPS: docker run -d -p 80:3000 -v ninja-data:/data ghcr.io/danhtrongit/ninja-school:latest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npm test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/danhtrongit/ninja-school:latest
            ghcr.io/danhtrongit/ninja-school:${{ github.sha }}
