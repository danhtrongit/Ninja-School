name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      # bước trình duyệt (mốc ảnh theo máy darwin-arm64) và tải 60 phút chạy ở máy dev: docs/DECISIONS.md D-06
      - run: npm run verify -- --no-browser --no-load
